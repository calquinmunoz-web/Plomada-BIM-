<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Plomada BIM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: barra superior + riel de pestañas + panel lateral + lienzo 3D a pantalla completa con herramientas flotantes */
:root{
  --bg:#11151b; --panel:#181e27; --panel2:#1f2733; --line:#2b3544; --fg:#e7ebf1; --muted:#8d99ab;
  --accent:#3fa9f5; --accent-fg:#06121d; --sel:#ffb020;
  --ok:#3ecf8e; --warn:#f5b83d; --bad:#f2555a;
  --view-top:#232c3a; --view-bot:#0f1318;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#e9edf2; --panel:#ffffff; --panel2:#f2f5f8; --line:#d3dae3; --fg:#17202b; --muted:#5d6b7d;
  --accent:#0b6fcc; --accent-fg:#ffffff; --sel:#d97a00;
  --ok:#128a57; --warn:#a86a00; --bad:#c92a30;
  --view-top:#f4f7fa; --view-bot:#cfd7e0; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#e9edf2; --panel:#ffffff; --panel2:#f2f5f8; --line:#d3dae3; --fg:#17202b; --muted:#5d6b7d;
  --accent:#0b6fcc; --accent-fg:#ffffff; --sel:#d97a00;
  --ok:#128a57; --warn:#a86a00; --bad:#c92a30;
  --view-top:#f4f7fa; --view-bot:#cfd7e0; color-scheme:light }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;align-items:center;gap:12px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:22px;height:26px;color:var(--accent)}
.proj{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.proj b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.small{min-height:34px;padding:0 10px;font-size:13px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}

main{display:flex;min-height:0;position:relative}
#rail{width:60px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:8px 0;padding-left:env(safe-area-inset-left,0px);box-sizing:content-box;z-index:3}
#rail button{width:52px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--muted);font-size:10px;font-weight:500;position:relative}
#rail button[aria-selected="true"]{background:var(--panel2);color:var(--accent)}
#rail .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;
  font-size:10px;line-height:16px;padding:0 4px;font-family:var(--mono)}

#side{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
#side h2{font-family:var(--display);font-size:15px;font-weight:700;margin:0;padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#side .body{flex:1;overflow:auto;min-height:0;padding:0 10px 14px;-webkit-overflow-scrolling:touch}
.hint{color:var(--muted);font-size:13px;line-height:1.45;padding:4px 4px 10px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 4px 6px}

/* Árbol */
.node>.row{display:flex;align-items:center;gap:2px;min-height:38px;border-radius:6px;padding-right:4px}
.node>.row.on{background:color-mix(in srgb,var(--sel) 18%,transparent)}
.node .tw,.node .eye{width:32px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.node .tw svg{width:16px;height:16px;transition:transform .12s}
.node.open>.row .tw svg{transform:rotate(90deg)}
.node .eye svg{width:18px;height:18px}
.node .eye.off{opacity:.35}
.node .name{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:38px}
.node .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);padding:0 4px}
.node .kids{margin-left:14px;border-left:1px solid var(--line);padding-left:2px}
.dot{width:9px;height:9px;border-radius:2px;flex:none;margin-right:6px;display:inline-block}

/* Tarjetas de lista */
.card{display:flex;gap:10px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px;text-align:left;width:100%;align-items:flex-start}
.card.on{border-color:var(--sel)}
.card img{width:84px;height:56px;object-fit:cover;border-radius:5px;flex:none;background:var(--bg)}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .s{color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
.card .mid{flex:1;min-width:0}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px;align-items:center}
.photos .ph{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex:none;padding:0}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
#dlg .box.photo{max-width:min(900px,100%);padding:12px}
#dlg .box.photo img{display:block;max-width:100%;max-height:calc(100vh - 220px);margin:0 auto;border-radius:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;
  border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{color:var(--bad)} .st-act{color:var(--warn)} .st-ok{color:var(--ok)} .st-rev{color:var(--accent)}
.x{width:30px;height:30px;border-radius:6px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.x svg{width:16px;height:16px}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;min-height:40px;padding:8px 10px;width:100%;user-select:text;-webkit-user-select:text}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Lienzo */
#view{flex:1;min-width:0;position:relative;background:linear-gradient(var(--view-top),var(--view-bot));overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
#tools{top:12px;left:12px;display:flex;flex-direction:column;padding:4px;gap:2px}
#tools button,#bar button{width:48px;height:48px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--fg)}
#tools button[aria-pressed="true"],#bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#bar{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;padding:4px;gap:2px;max-width:calc(100% - 24px);overflow-x:auto}
#bar button{width:58px;flex:none}
#bar .sep{width:1px;background:var(--line);margin:8px 3px;flex:none}
#props{top:12px;right:max(12px,env(safe-area-inset-right,0px));width:300px;max-width:calc(100% - 96px);max-height:calc(100% - 100px);display:flex;flex-direction:column}
#props header{background:none;border-bottom:1px solid var(--line);padding:10px 8px 10px 14px}
#props h3{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#props .pb{overflow:auto;padding:6px 14px 12px;user-select:text;-webkit-user-select:text}
#props dl{margin:0;display:grid;grid-template-columns:minmax(90px,2fr) 3fr;gap:5px 10px;font-size:13px}
#props dt{color:var(--muted)} #props dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#props .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 6px}
#sect{bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 12px;display:flex;align-items:center;gap:10px;width:min(520px,calc(100% - 24px))}
#sect .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
#sect .seg button{width:38px;height:36px;font-family:var(--mono);font-weight:500}
#sect #sMode button{width:auto;padding:0 10px;font-family:var(--font)}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ink.on{pointer-events:auto;touch-action:none;cursor:crosshair}
#inkbar{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;z-index:6;max-width:calc(100% - 24px);overflow-x:auto}
#inkbar button{min-width:46px;height:44px;border-radius:9px;padding:0 10px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px}
#inkbar button[aria-pressed="true"]{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--accent)}
#inkbar .sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel)}
#inkbar .sep{width:1px;height:26px;background:var(--line);margin:0 3px;flex:none}
#menu .sw{width:14px;height:14px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:-2px}
#sect .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#sect input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--accent)}
#sect output{font-family:var(--mono);font-size:12px;width:64px;text-align:right;flex:none}
#menu{padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
#menu button{min-width:84px;height:42px;border-radius:8px;padding:0 10px}
#menu button:active{background:var(--panel2)}
#mbar{top:12px;left:76px;max-width:calc(100% - 88px);padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;z-index:3}
#mbar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
#mbar .seg button{height:36px;padding:0 11px;font-size:13px}
#mbar .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#mbar .hint{font-size:13px;color:var(--muted,inherit);opacity:.85}
#wbar{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;padding:4px;gap:2px}
#wbar button{width:62px;height:48px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--fg)}
#wbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#wbar .sep{width:1px;background:var(--line);margin:8px 3px;flex:none}
#joy{position:absolute;left:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px solid var(--line);touch-action:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--accent);opacity:.9;pointer-events:none}
#src{top:8px;right:max(12px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 24px));padding:6px;z-index:7;display:flex;flex-direction:column;gap:2px}
#src button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:8px;min-height:54px}
#src button:active{background:var(--panel2)}
#src span,#src p{color:var(--muted);font-size:12px;line-height:1.4}
#src p{margin:4px 12px 6px}
#dlg{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 65%,transparent)}
#dlg .box{position:relative;max-width:540px;max-height:100%;overflow:auto;padding:18px 20px;user-select:text;-webkit-user-select:text}
#dlg h3{font-family:var(--display);font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}
#dlg p,#dlg li{line-height:1.5;margin:0 0 8px}
#dlg ol{margin:0 0 8px;padding-left:20px}
#dlg .s{color:var(--muted);font-size:13px}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
#dlg .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:12px 0}
#dlg .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
#dlg .bar.ind i{width:35%;animation:ind 1.4s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:65%}}
#apsv{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#apsv .top{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
#apsv .top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#apsv .top span{color:var(--muted);font-size:12px;flex:1;white-space:nowrap}
#apsv iframe{flex:1;width:100%;border:0;min-height:0}
#status{top:12px;left:76px;padding:8px 12px;font-size:13px;max-width:calc(100% - 420px);min-width:160px}
#toast{left:50%;top:14px;transform:translateX(-50%);padding:10px 16px;font-weight:500;z-index:9;max-width:calc(100% - 32px);text-align:center}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:12px;font-weight:500;
  padding:3px 7px;border-radius:5px;white-space:nowrap}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;width:30px;height:38px;color:#fff;font-family:var(--mono);font-size:12px;font-weight:500}
.pin svg{position:absolute;inset:0;width:30px;height:38px}
.pin span{position:absolute;left:0;right:0;top:6px;text-align:center}
#drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:20px;background:color-mix(in srgb,var(--bg) 70%,transparent);pointer-events:none}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 60%,transparent);z-index:8;font-weight:500}

@media (max-width:860px){
  #side{position:absolute;left:calc(60px + env(safe-area-inset-left,0px));top:0;bottom:0;width:min(330px,calc(100% - 60px - env(safe-area-inset-left,0px)));box-shadow:8px 0 24px rgba(0,0,0,.3)}
  #status{display:none}
  .proj span{display:none}
  #props{top:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px));right:12px;left:72px;width:auto;max-width:none;max-height:42%}
  .btn .txt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M11 1v6M5 7h12l-1.5 9L11 25l-4.5-9z"/><path d="M6.5 16h9"/></svg>
      Plomada
    </div>
    <div class="proj"><b id="pname">Edificio de oficinas · modelo de ejemplo</b><span id="pstat"></span></div>
    <button class="btn" id="bDemo" hidden><span class="txt">Cargar ejemplo</span></button>
    <button class="btn primary" id="bOpen"><svg class="i" viewBox="0 0 24 24"><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7L10 4H5a2 2 0 0 0-2 2z"/></svg><span class="txt">Abrir modelo</span></button>
    <input type="file" id="file" accept=".ifc,.fbx,.glb,.gltf,.obj,.nwd,.nwc,.nwf" multiple hidden>

  <main>
    <nav id="rail" role="tablist" aria-label="Paneles"></nav>

      <canvas id="gl"></canvas>
      <div id="ov"></div>
      <canvas id="ink"></canvas>
      <div class="float" id="inkbar" role="toolbar" aria-label="Anotar" hidden></div>
      <div class="float" id="tools" role="toolbar" aria-label="Herramientas"></div>
      <div class="float" id="status" hidden></div>
      <div class="float" id="mbar" role="toolbar" aria-label="Medir" hidden></div>
      <div class="float" id="props" hidden></div>
      <div class="float" id="sect" hidden>
        <div class="seg" id="sMode"><button data-m="plane">Plano</button><button data-m="box">Caja</button></div>

        <output id="sOut"></output>
        <button class="btn small" id="sFlip">Invertir</button>
        <button class="btn small" id="sFit" hidden>A selección</button>
      </div>
      <div class="float" id="menu" hidden></div>
      <div class="float" id="bar" role="toolbar" aria-label="Vista"></div>
      <div id="joy" role="application" aria-label="Palanca para caminar" hidden><i></i></div>
      <div class="float" id="wbar" role="toolbar" aria-label="Caminar" hidden></div>
      <div class="float" id="src" hidden></div>
      <div class="float" id="toast" hidden></div>
      <div id="drop" hidden>Suelta aquí archivos IFC, GLB u OBJ</div>
      <div id="busy" hidden></div>
      <div id="dlg" hidden></div>
    </section>
    <div id="apsv" hidden></div>
  </main>
</div>

const matCache=new Map();
function mat(color,opacity=1){const k=color+'|'+opacity; let m=matCache.get(k);
  if(!m){m=new THREE.MeshStandardMaterial({color,roughness:.82,metalness:.04,transparent:opacity<1,opacity,depthWrite:opacity>=1,side:THREE.DoubleSide});matCache.set(k,m);} return m;}

  ghost:new THREE.MeshBasicMaterial({color:0x8fa3b8,transparent:true,opacity:.07,depthWrite:false,side:THREE.DoubleSide}),
  a:new THREE.MeshStandardMaterial({color:0xf2555a,emissive:0x7a1014,emissiveIntensity:.5,side:THREE.DoubleSide}),
  b:new THREE.MeshStandardMaterial({color:0x3ecf8e,emissive:0x0c5a37,emissiveIntensity:.5,side:THREE.DoubleSide}),
  edge:new THREE.LineBasicMaterial({color:0x1b222c,transparent:true,opacity:.45}) };
const wireCache=new Map();
function wire(m){let w=wireCache.get(m); if(!w){w=new THREE.MeshBasicMaterial({color:m.color?m.color.clone():0x999999,wireframe:true});wireCache.set(m,w);} return w;}

function addElement(model,o){ // o:{name,category,discipline,level,path,props,meshes}
  const el=Object.assign({id:nextId++,model,box:new THREE.Box3()},o);
  for(const m of el.meshes){ m.userData.el=el; m.userData.mat=m.material; model.root.add(m); m.updateMatrixWorld(true);
    if(!m.geometry.boundingBox)m.geometry.computeBoundingBox();
    el.box.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld)); S.meshes.push(m); }
  S.els.set(el.id,el); model.els.push(el); return el;
}
function addEdges(model){ if(model.els.length>4000)return;
  for(const el of model.els)for(const m of el.meshes){ const pos=m.geometry.attributes.position; if(!pos||pos.count>6000)continue;
    const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,30),M.edge); l.raycast=()=>{}; m.add(l);} }

function refreshMaterials(){
  const cs=S.clashSel;
  for(const m of S.meshes){ const el=m.userData.el, base=m.userData.mat; let mt;
    m.visible=!S.hidden.has(el.id);
    if(cs&&(el.id===cs.a||el.id===cs.b)) mt=el.id===cs.a?M.a:M.b;
    else if(S.sel.has(el.id)) mt=M.sel;
    else if(cs||S.mode==='xray') mt=M.ghost;
    else { const o=S.over.get(el.id), b2=o?mat(o.color,o.alpha):base; mt=S.mode==='wire'?wire(b2):b2; }
    m.material=mt; m.renderOrder=mt===M.ghost?1:0;
    for(const c of m.children)c.visible=S.mode!=='wire';
  }
  M.edge.opacity=(cs||S.mode==='xray')?.12:.45; invalidate();
}

/* ───────── Gestión de modelos ───────── */
function addModel(model){ world.add(model.root); S.models.push(model); afterModelsChanged(true); }
function afterModelsChanged(fit){
  S.bbox.makeEmpty(); for(const el of S.els.values())S.bbox.union(el.box);
  if(grid){scene.remove(grid);grid=null;}
  if(!S.bbox.isEmpty()){ const sz=S.bbox.getSize(new THREE.Vector3()), c=S.bbox.getCenter(new THREE.Vector3());
    const g=Math.max(sz.x,sz.z)*1.6, step=g>400?10:g>60?5:1, div=Math.max(2,Math.round(g/step));
    grid=new THREE.GridHelper(div*step,div,0x6b7a8f,0x6b7a8f); grid.material.transparent=true; grid.material.opacity=.22;
    grid.position.set(Math.round(c.x/step)*step,S.bbox.min.y-.01,Math.round(c.z/step)*step); scene.add(grid);
    camera.near=Math.max(.05,sz.length()/2000); camera.far=sz.length()*60+100; camera.updateProjectionMatrix(); }
  const tris=S.meshes.reduce((a,m)=>a+((m.geometry.index?m.geometry.index.count:m.geometry.attributes.position.count)/3),0);
  $('#pname').textContent=S.models.length?S.models.map(m=>m.name).join(' + '):'Sin modelo';
  $('#pstat').textContent=S.els.size.toLocaleString('es')+' elementos · '+Math.round(tris).toLocaleString('es')+' triángulos · unidades en metros';
  $('#bDemo').hidden=S.models.some(m=>m.id==='demo');
  S.open=new Set(S.models.map(m=>m.name)); const ds=disciplines();
  S.clashCfg.a=ds.includes('Instalaciones')?'Instalaciones':(ds[0]||''); S.clashCfg.b=ds.includes('Estructura')?'Estructura':(ds[1]||ds[0]||'');
  applySection(); refreshMaterials(); if(fit)goView('iso',null,true); renderSide(); renderProps();
}

let tween=null;
function flyTo(pos,target,instant){ if(instant||reduceMotion){camera.position.copy(pos);controls.target.copy(target);controls.update();invalidate();return;}
  tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos.clone(),t1:target.clone(),s:performance.now(),d:450}; invalidate(); }
function goView(kind,box,instant){ if(WALK)exitWalk(false); box=box||visibleBox(); if(box.isEmpty())return;
  const c=box.getCenter(new THREE.Vector3()), r=Math.max(box.getSize(new THREE.Vector3()).length()/2,.5);
  const dist=r/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*(camera.aspect<1?1/camera.aspect:1)*.95;
  const dir={iso:[1,.75,1],top:[0,1,.0001],front:[0,0,1],back:[0,0,-1],right:[1,0,0],left:[-1,0,0],keep:null}[kind];
  const v=dir?new THREE.Vector3(...dir).normalize():camera.position.clone().sub(controls.target).normalize();
  flyTo(c.clone().add(v.multiplyScalar(dist)),c,instant); }
function visibleBox(){ const b=new THREE.Box3(); for(const el of S.els.values())if(!S.hidden.has(el.id))b.union(el.box); return b; }
function selBox(){ const b=new THREE.Box3(); for(const id of S.sel){const e=S.els.get(id); if(e)b.union(e.box);} return b; }

/* ───────── Sección ───────── */
const boxPlanes=[0,1,2,3,4,5].map(()=>new THREE.Plane());
const clipped=p=>renderer.clippingPlanes.some(pl=>pl.distanceToPoint(p)<0);
function applySection(){ const s=S.section; $('#sect').hidden=!s.on;
  if(!s.on||S.bbox.isEmpty()){renderer.clippingPlanes=[];invalidate();return;}
  const box=s.mode==='box';
  $('#sAxis').hidden=box; $('#sFlip').hidden=box; $('#sFit').hidden=!box;
  $('#sMode').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.m==='box')===box)));
  if(box){ // caja de sección: seis planos alrededor de la selección o del modelo; el deslizador cambia su tamaño
    const b=s.base?new THREE.Box3(new THREE.Vector3().fromArray(s.base[0]),new THREE.Vector3().fromArray(s.base[1])):S.bbox.clone();
    const k=.05+.95*s.t, c=b.getCenter(new THREE.Vector3()), hf=b.getSize(new THREE.Vector3()).multiplyScalar(.5*k).addScalar(.02);
    ['x','y','z'].forEach((a,i)=>{ const lo=boxPlanes[i*2], hi=boxPlanes[i*2+1];
      lo.normal.set(0,0,0); lo.normal[a]=1; lo.constant=-(c[a]-hf[a]); hi.normal.set(0,0,0); hi.normal[a]=-1; hi.constant=c[a]+hf[a]; });
    renderer.clippingPlanes=boxPlanes; $('#sOut').textContent=Math.round(k*100)+' %'; $('#sPos').value=Math.round(s.t*1000); invalidate(); return; }
  const lo=S.bbox.min[s.axis]-.05, hi=S.bbox.max[s.axis]+.05, p=lo+(hi-lo)*s.t;
  plane.normal.set(0,0,0); plane.normal[s.axis]=s.flip?1:-1; plane.constant=s.flip?-p:p;
  renderer.clippingPlanes=[plane];
  $('#sOut').textContent=(p>=0?'+':'')+fmt(p)+' m'; $('#sPos').value=Math.round(s.t*1000);
  $('#sAxis').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a===s.axis)); invalidate(); }
$('#sAxis').addEventListener('click',e=>{const a=e.target.dataset.a; if(a){S.section.axis=a;applySection();}});
$('#sPos').addEventListener('input',e=>{S.section.t=e.target.value/1000;applySection();});
$('#sFlip').addEventListener('click',()=>{S.section.flip=!S.section.flip;applySection();});
$('#sMode').addEventListener('click',e=>{const m=e.target.dataset.m; if(m){S.section.mode=m;applySection();}});
$('#sFit').addEventListener('click',()=>{ if(!S.sel.size)return toast('Selecciona primero los elementos que quieres encerrar en la caja');
  const b=selBox().expandByScalar(.5); S.section.base=[b.min.toArray(),b.max.toArray()]; S.section.t=1; applySection(); goView('keep',b); });

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(ev){ const r=canvas.getBoundingClientRect(); ndc.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);

function walkTap(hit){ const n=faceN(hit); if(!n||n.y<.5)return false; WALK.go=hit.point.clone(); invalidate(); return true; }
function walkLevel(dir){ const w=WALK, x=w.pos.x, z=w.pos.z; let f=null;
  if(dir>0){ const c=wcast(new THREE.Vector3(x,w.pos.y+EYE,z),UPV,60); if(c)f=wcast(new THREE.Vector3(x,c.point.y+1.5,z),DOWN,1.6,true); }
  else f=wcast(new THREE.Vector3(x,w.pos.y-.05,z),DOWN,200,true);
  if(!f)return toast(dir>0?'No hay un nivel por encima de este punto':'No hay un nivel por debajo de este punto');
  w.pos.copy(f.point); w.vy=0; w.settled=false; walkCam(); }
function renderWalkBar(){ const w=WALK, b=(ic,t,fn,pressed)=>h('button',{'aria-label':t,'aria-pressed':pressed?'true':null,onclick:fn},icon(ic),t);
  $('#wbar').replaceChildren(b('up','Subir',()=>walkLevel(1)),b('down','Bajar',()=>walkLevel(-1)),
    b('wall','Colisión',()=>{ w.col=!w.col; w.vy=0; w.settled=false; renderWalkBar(); toast(w.col?'Colisión y gravedad activadas':'Vuelo libre: atraviesas los muros y no caes'); },w.col),
    h('span',{class:'sep'}),b('exit','Salir',()=>exitWalk(true))); }
function walkStep(dt){ const w=WALK;
  if(w.go){ const d=w.go.clone().sub(w.pos), l=d.length(), s=Math.max(8,l*6)*dt; if(l<=s||reduceMotion){w.pos.copy(w.go);w.go=null;w.vy=0;w.settled=false;} else w.pos.addScaledVector(d,s/l); walkCam(); return; }
  const k=w.keys, on=(a,b)=>k.has(a)||k.has(b)?1:0;
  let sx=w.stick.x+on('d','arrowright')-on('a','arrowleft'), sy=w.stick.y+on('s','arrowdown')-on('w','arrowup');
  const mag=Math.hypot(sx,sy), moving=mag>=.08; if(!moving&&w.settled)return;
  const step=new THREE.Vector3(), sin=Math.sin(w.yaw), cos=Math.cos(w.yaw);
  if(moving){ const m=Math.min(1,mag)/mag*(k.has('shift')?5:2)*dt; sx*=m; sy*=m;
    if(w.col)step.set(sin*sy+cos*sx,0,cos*sy-sin*sx);
    else{ camera.getWorldDirection(step).multiplyScalar(-sy); step.x+=cos*sx; step.z-=sin*sx; } }
  if(!w.col){ w.pos.add(step); w.settled=!moving; walkCam(); return; }
  const from=w.pos.clone(); let len=step.length();
  if(len>0){ const o=new THREE.Vector3(w.pos.x,w.pos.y+.9,w.pos.z), hh=wcast(o,step.clone().divideScalar(len),len+.4);
    if(hh){ const n=faceN(hh)||step.clone().negate(); n.y=0; // se desliza a lo largo del muro en vez de quedarse pegado
      if(n.lengthSq()<1e-6)step.set(0,0,0);
      else{ n.normalize(); if(n.dot(step)>0)n.negate(); step.addScaledVector(n,-step.dot(n)); len=step.length();
        if(len<1e-5||wcast(o,step.clone().divideScalar(len),len+.4))step.set(0,0,0); } }
    w.pos.add(step); }
  const f=wcast(new THREE.Vector3(w.pos.x,w.pos.y+EYE,w.pos.z),DOWN,400,true);
  if(f){ const fy=f.point.y;
    if(fy-w.pos.y>.55&&len>0){ w.pos.copy(from); w.settled=false; }           // escalón demasiado alto: no se sube
    else{ if(w.pos.y>fy+.01){ w.vy-=9.8*dt; w.pos.y+=w.vy*dt; if(w.pos.y<=fy){w.pos.y=fy;w.vy=0;} }
      else{ w.pos.y+=(fy-w.pos.y)*Math.min(1,dt*14); w.vy=0; }
      w.settled=!moving&&Math.abs(w.pos.y-fy)<.004; } }
  else{ w.vy=0; w.settled=!moving; }                                          // sin suelo debajo: se queda a su altura
  walkCam(); }
canvas.addEventListener('pointerdown',e=>{ if(!WALK||WALK.look)return; WALK.look={id:e.pointerId,x:e.clientX,y:e.clientY}; try{canvas.setPointerCapture(e.pointerId);}catch(x){} });
canvas.addEventListener('pointermove',e=>{ const w=WALK; if(!w||!w.look||w.look.id!==e.pointerId)return;
  w.yaw-=(e.clientX-w.look.x)*.0045; w.pitch=Math.max(-1.4,Math.min(1.4,w.pitch-(e.clientY-w.look.y)*.0045)); w.look.x=e.clientX; w.look.y=e.clientY; walkCam(); });
const lookEnd=e=>{ if(WALK&&WALK.look&&WALK.look.id===e.pointerId)WALK.look=null; };
canvas.addEventListener('pointerup',lookEnd); canvas.addEventListener('pointercancel',lookEnd);
{ const joy=$('#joy'), knob=joy.firstChild; let jid=null;
  const mv=e=>{ const r=joy.getBoundingClientRect(), R=44; let x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2; const l=Math.hypot(x,y); if(l>R){x*=R/l;y*=R/l;}
    knob.style.transform='translate('+x+'px,'+y+'px)'; if(WALK){WALK.stick.x=x/R;WALK.stick.y=y/R;} };
  const end=e=>{ if(e.pointerId!==jid)return; jid=null; knob.style.transform=''; if(WALK){WALK.stick.x=0;WALK.stick.y=0;} };
  joy.addEventListener('pointerdown',e=>{ if(jid!==null)return; jid=e.pointerId; try{joy.setPointerCapture(jid);}catch(x){} e.preventDefault(); mv(e); });
  joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid)mv(e); });
  joy.addEventListener('pointerup',end); joy.addEventListener('pointercancel',end); }
const WKEYS=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift'];
addEventListener('keydown',e=>{ if(!WALK||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return; const k=e.key.toLowerCase();
  if(k==='escape')return exitWalk(true); if(WKEYS.includes(k)){WALK.keys.add(k); if(k!=='shift')e.preventDefault();} });
addEventListener('keyup',e=>{ if(WALK)WALK.keys.delete(e.key.toLowerCase()); });
addEventListener('blur',()=>{ if(WALK)WALK.keys.clear(); });
let lastT=0;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-lastT)/1000)||0; lastT=now;
  if(WALK){ walkStep(dt); render(); return; }
  if(tween){ let t=Math.min(1,(now-tween.s)/tween.d); t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; camera.position.lerpVectors(tween.p0,tween.p1,t); controls.target.lerpVectors(tween.t0,tween.t1,t); if(t>=1)tween=null; dirty=true; }
  controls.update(); render(); }
function resize(){ const w=view.clientWidth, hh=view.clientHeight; if(!w||!hh)return; renderer.setSize(w,hh,false); camera.aspect=w/hh; camera.updateProjectionMatrix(); invalidate(); drawInk(); }
new ResizeObserver(resize).observe(view);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{for(const e of pins.values())e.remove();pins.clear();invalidate();});

/* ───────── Arranque ───────── */
$('#side').hidden=!sideOpen; renderRail(); renderTools(); renderBar(); resize();
addModel(buildDemo());
requestAnimationFrame(loop);
})();
</script>
